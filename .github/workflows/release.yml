name: Android Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: sdkmanager "ndk;28.0.13004108" "cmake;3.22.1"

      # The tagged source must already carry the version - F-Droid builds
      # the tag as-is, so a CI-time rewrite would make the two APKs differ.
      # A release with a forgotten bump fails here instead of shipping.
      - name: Verify committed version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH BUILD <<< "$TAG"
          BUILD="${BUILD:-0}"
          VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + BUILD ))
          fail=0
          grep -q "versionCode = $VERSION_CODE\$" android/app/build.gradle.kts \
            || { echo "::error::build.gradle.kts versionCode != $VERSION_CODE"; fail=1; }
          grep -q "versionName = \"$TAG\"\$" android/app/build.gradle.kts \
            || { echo "::error::build.gradle.kts versionName != \"$TAG\""; fail=1; }
          grep -q "g_version_str = \"v$MAJOR.$MINOR.$PATCH\"" src/version.cpp \
            || { echo "::error::version.cpp g_version_str != v$MAJOR.$MINOR.$PATCH"; fail=1; }
          grep -qE "g_version_str \+ \"\.$BUILD(-|\")" src/version.cpp \
            || { echo "::error::version.cpp build increment != .$BUILD"; fail=1; }
          test -f "fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt" \
            || { echo "::error::missing fastlane changelog $VERSION_CODE.txt"; fail=1; }
          exit $fail

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $HOME/ia-release.keystore

      - name: Create keystore.properties
        working-directory: android
        run: |
          echo "storeFile=$HOME/ia-release.keystore"            > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=release"                               >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"        >> keystore.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "infra-arcana-${GITHUB_REF_NAME}.apk"

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: infra-arcana-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
