name: Android Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: sdkmanager "ndk;28.0.13004108" "cmake;3.22.1"

      - name: Stamp version from tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH BUILD <<< "$TAG"
          BUILD="${BUILD:-0}"
          VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + BUILD ))
          sed -i "s/versionCode = .*/versionCode = $VERSION_CODE/" android/app/build.gradle.kts
          sed -i "s/versionName = .*/versionName = \"$TAG\"/" android/app/build.gradle.kts

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $HOME/ia-release.keystore

      - name: Create keystore.properties
        working-directory: android
        run: |
          echo "storeFile=$HOME/ia-release.keystore"            > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=release"                               >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"        >> keystore.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk \
               "infra-arcana-${GITHUB_REF_NAME}.apk"

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: infra-arcana-${{ github.ref_name }}.apk
